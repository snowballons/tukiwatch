name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: Kotlin / Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "zulu"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android platform and build tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Shared and UI tests
        working-directory: app
        run: ./gradlew :shared:jvmTest :ui:jvmTest --stacktrace

      - name: Desktop harness tests
        working-directory: app
        run: xvfb-run -a ./gradlew :desktopApp:test --stacktrace

      - name: Build debug APK
        working-directory: app
        run: ./gradlew :androidApp:assembleDebug -Pchaquopy.buildPython=python3.11 --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tukiwatch-debug-apk
          path: app/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 7

  python-engine:
    name: Python engine
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip streamlink==8.6.2 pytest

      - name: Run engine parity tests
        run: python -m pytest app/androidApp/src/test/python -q
