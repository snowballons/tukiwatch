# Builds the official Android APKs via EAS and publishes a GitHub release + update manifest.
# NOTE: expo-doctor reports 21/22 — Hermes V1 memory regression on Expo SDK 56
# (expo@56.0.20 / RN 0.85.3 / Hermes 250829098.0.10). Accepted for this release;
# plan an SDK 57 upgrade (RN 0.86.2+) to clear it on the next one.
#
# Two variants are built from the same source via per-profile ANDROID_ABI env
# (see app.config.js + app/plugins/withAbiFilter.js):
#   - tukiwatch-<version>-arm64.apk     (arm64-v8a only, the primary download)
#   - tukiwatch-<version>-universal.apk (all ABIs, fallback for 32-bit devices)
#
# Triggered manually via workflow_dispatch. The tag (v*) path is intentionally
# not supported: it checked out a detached HEAD, so the final version.json
# commit+push could not succeed.
#
# Idempotent: re-running for a version whose release already ships BOTH APKs
# does nothing. Finished EAS builds are reused per profile (e.g. a previous
# run that failed after the build). Pass `force` to rebuild anyway.

name: Android APK Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.6)"
        required: true
      force:
        description: "Rebuild even if a release or finished EAS builds already exist"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Normalize to SemVer (allow "1.0.6" or "v1.0.6")
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "arm64_asset=tukiwatch-${VERSION}-arm64.apk" >> "$GITHUB_OUTPUT"
          echo "universal_asset=tukiwatch-${VERSION}-universal.apk" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${VERSION}"

      - name: Check for existing release APKs
        id: check-release
        if: github.event.inputs.force != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ASSETS=$(gh release view "v${VERSION}" --json assets \
            --jq '.assets[]? | select(.name | endswith(".apk")) | .name' 2>/dev/null || true)
          MISSING=""
          for want in "${{ steps.version.outputs.arm64_asset }}" "${{ steps.version.outputs.universal_asset }}"; do
            echo "${ASSETS}" | grep -qx "${want}" || MISSING="${MISSING} ${want}"
          done
          if [ -z "${MISSING}" ]; then
            echo "Release v${VERSION} already ships both APKs — nothing to do."
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release v${VERSION} is missing:${MISSING}."
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reuse existing EAS builds (same appVersion, per profile)
        id: reuse
        if: steps.check-release.outputs.existing == 'false'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for variant in arm64 universal; do
            HIT=$(eas build:list --platform android --buildProfile "production-${variant}" \
                --status finished --json --non-interactive --limit 100 2>/dev/null \
              | node -e "
                  const builds = JSON.parse(require('fs').readFileSync(0, 'utf8'));
                  const v = '$VERSION';
                  const hit = (Array.isArray(builds) ? builds : [])
                    .filter(b => String(b.status || '').toUpperCase() === 'FINISHED')
                    .filter(b => String(b.appVersion || '') === v)
                    .filter(b => b.artifacts && b.artifacts.buildUrl)
                    .sort((x, y) => new Date(y.createdAt) - new Date(x.createdAt))[0];
                  if (hit) console.log(JSON.stringify(hit));
                " || true)
            if [ -n "${HIT}" ]; then
              echo "build-url-${variant}=$(echo "${HIT}" | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).artifacts.buildUrl)")" >> "$GITHUB_OUTPUT"
              echo "version-code-${variant}=$(echo "${HIT}" | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).appBuildVersion || '')")" >> "$GITHUB_OUTPUT"
              echo "Reusing finished EAS build (production-${variant}) for v${VERSION} — skipping that build."
            else
              echo "No reusable finished EAS build (production-${variant}) for v${VERSION}."
            fi
          done

      - name: Set app version in app.json
        if: steps.check-release.outputs.existing != 'true'
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            cfg.expo.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2) + '\n');
          "

      - name: Build arm64 APK
        if: steps.check-release.outputs.existing != 'true' && steps.reuse.outputs.build-url-arm64 == ''
        env:
          EXPO_PUBLIC_UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/snowballons/tukiwatch/main/app/version.json
        run: eas build --platform android --profile production-arm64 --non-interactive --json > build-arm64.json

      - name: Build universal APK
        if: steps.check-release.outputs.existing != 'true' && steps.reuse.outputs.build-url-universal == ''
        env:
          EXPO_PUBLIC_UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/snowballons/tukiwatch/main/app/version.json
        run: eas build --platform android --profile production-universal --non-interactive --json > build-universal.json

      - name: Download APK artifacts
        if: steps.check-release.outputs.existing != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p build
          for variant in arm64 universal; do
            case "${variant}" in
              arm64) BUILD_URL="${{ steps.reuse.outputs.build-url-arm64 }}"; JSON="build-arm64.json"; NAME="${{ steps.version.outputs.arm64_asset }}";;
              universal) BUILD_URL="${{ steps.reuse.outputs.build-url-universal }}"; JSON="build-universal.json"; NAME="${{ steps.version.outputs.universal_asset }}";;
            esac
            if [ -z "${BUILD_URL}" ]; then
              BUILD_URL=$(variant="${variant}" json="${JSON}" node -e "
                const b = require('./' + process.env.json);
                const builds = Array.isArray(b) ? b : [b];
                const a = builds[builds.length - 1];
                const status = String((a && a.status) || '').toUpperCase();
                if (status !== 'FINISHED') throw new Error(process.env.variant + ' build status ' + status);
                if (!a || !a.artifacts || !a.artifacts.buildUrl) throw new Error(process.env.json + ' has no buildUrl');
                console.log(a.artifacts.buildUrl);
              ")
            fi
            curl -fL -H "Authorization: Bearer ${EXPO_TOKEN}" "$BUILD_URL" -o "build/${NAME}"
          done

      - name: Read built versionCodes
        id: versioncode
        if: steps.check-release.outputs.existing != 'true'
        run: |
          for variant in arm64 universal; do
            CODE=""
            if [ -f "build-${variant}.json" ]; then
              CODE=$(variant="${variant}" node -e "
                const b = require('./build-' + process.env.variant + '.json');
                const a = Array.isArray(b) ? b[b.length - 1] : b;
                console.log((a && a.appBuildVersion) || '');
              ")
            fi
            if [ -z "${CODE}" ]; then
              CODE="${{ steps.reuse.outputs.version-code-arm64 }}"
              if [ "${variant}" = "universal" ]; then
                CODE="${{ steps.reuse.outputs.version-code-universal }}"
              fi
            fi
            echo "versionCode ${variant}: ${CODE}"
            echo "version-code-${variant}=${CODE}" >> "$GITHUB_OUTPUT"
          done

      - name: Create GitHub Release
        id: release
        if: steps.check-release.outputs.existing != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TukiWatch v${{ steps.version.outputs.version }}
          files: app/build/*.apk
          generate_release_notes: true

      - name: Update version.json
        if: steps.check-release.outputs.existing != 'true'
        run: |
          node -e "
            const fs = require('fs');
            const v = '${{ steps.version.outputs.version }}';
            const repo = 'https://github.com/${{ github.repository }}/releases/download/v' + v + '/';
            const manifest = {
              version: v,
              versionCode: Number('${{ steps.versioncode.outputs.version-code-universal }}'),
              versionCodeArm64: Number('${{ steps.versioncode.outputs.version-code-arm64 }}'),
              apkUrl: repo + '${{ steps.version.outputs.universal_asset }}',
              apkUrlArm64: repo + '${{ steps.version.outputs.arm64_asset }}',
              releaseNotes: 'Released via GitHub Actions.',
              mandatory: false,
              minAndroidVersion: 8,
            };
            fs.writeFileSync('version.json', JSON.stringify(manifest, null, 2) + '\n');
          "

      - name: Commit version.json + app.json
        if: steps.check-release.outputs.existing != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json app.json
          git commit -m "chore: bump version to v${{ steps.version.outputs.version }}"
          git push
