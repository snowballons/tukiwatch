# Builds the official Android APK via EAS and publishes a GitHub release + update manifest.
# NOTE: expo-doctor reports 21/22 — Hermes V1 memory regression on Expo SDK 56
# (expo@56.0.20 / RN 0.85.3 / Hermes 250829098.0.10). Accepted for this release;
# plan an SDK 57 upgrade (RN 0.86.2+) to clear it on the next one.
#
# Triggered manually via workflow_dispatch. The tag (v*) path is intentionally
# not supported: it checked out a detached HEAD, so the final version.json
# commit+push could not succeed.
#
# Idempotent: re-running for a version that is already released (GitHub release
# with an APK) does nothing. If only a finished EAS build exists for the version
# (e.g. a previous run that failed after the build), that APK is reused instead
# of building again. Pass `force` to rebuild anyway.

name: Android APK Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.6)"
        required: true
      force:
        description: "Rebuild even if a release or finished EAS build already exists"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Normalize to SemVer (allow "1.0.6" or "v1.0.6")
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${VERSION}"

      - name: Check for existing release APK
        id: check-release
        if: github.event.inputs.force != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK_ASSET=$(gh release view "v${VERSION}" --json assets \
            --jq '.assets[]? | select(.name | endswith(".apk")) | .name' 2>/dev/null || true)
          if [ -n "${APK_ASSET}" ]; then
            echo "Release v${VERSION} already ships '${APK_ASSET}' — nothing to do."
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release with an APK for v${VERSION}."
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reuse existing EAS build (same appVersion)
        id: reuse
        if: steps.check-release.outputs.existing == 'false'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          HIT=$(eas build:list --platform android --buildProfile production \
              --status finished --json --non-interactive --limit 100 2>/dev/null \
            | node -e "
                const builds = JSON.parse(require('fs').readFileSync(0, 'utf8'));
                const v = '$VERSION';
                const hit = (Array.isArray(builds) ? builds : [])
                  .filter(b => String(b.status || '').toUpperCase() === 'FINISHED')
                  .filter(b => String(b.appVersion || '') === v)
                  .filter(b => b.artifacts && b.artifacts.buildUrl)
                  .sort((x, y) => new Date(y.createdAt) - new Date(x.createdAt))[0];
                if (hit) console.log(JSON.stringify(hit));
              " || true)
          if [ -n "${HIT}" ]; then
            BUILD_URL=$(echo "${HIT}" | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).artifacts.buildUrl)")
            VERSION_CODE=$(echo "${HIT}" | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).appBuildVersion || '')")
            echo "build-url=${BUILD_URL}" >> "$GITHUB_OUTPUT"
            echo "version-code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
            echo "Reusing finished EAS build for v${VERSION} (versionCode ${VERSION_CODE:-?}) — skipping the EAS build."
          else
            echo "No reusable finished EAS build for v${VERSION} — a fresh build is required."
          fi

      - name: Set app version in app.json
        if: steps.check-release.outputs.existing != 'true'
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            cfg.expo.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2) + '\n');
          "

      - name: Build Android APK
        if: steps.check-release.outputs.existing != 'true' && steps.reuse.outputs.build-url == ''
        env:
          EXPO_PUBLIC_UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/snowballons/tukiwatch/main/app/version.json
        run: eas build --platform android --profile production --non-interactive --json > build.json

      - name: Download APK artifact
        if: steps.check-release.outputs.existing != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_URL="${{ steps.reuse.outputs.build-url }}"
          if [ -z "${BUILD_URL}" ]; then
            BUILD_URL=$(node -e "
              const b = require('./build.json');
              const builds = Array.isArray(b) ? b : [b];
              const a = builds[builds.length - 1];
              const status = String((a && a.status) || '').toUpperCase();
              if (status !== 'FINISHED') throw new Error('build status ' + status);
              if (!a || !a.artifacts || !a.artifacts.buildUrl) throw new Error('build.json has no buildUrl');
              console.log(a.artifacts.buildUrl);
            ")
          fi
          mkdir -p build
          curl -fL -H "Authorization: Bearer ${EXPO_TOKEN}" "$BUILD_URL" -o "build/tukiwatch-${VERSION}.apk"

      - name: Read built versionCode
        id: versioncode
        if: steps.check-release.outputs.existing != 'true'
        run: |
          VERSION_CODE=""
          if [ -f build.json ]; then
            VERSION_CODE=$(node -e "
              const b = require('./build.json');
              const a = Array.isArray(b) ? b[b.length - 1] : b;
              console.log((a && a.appBuildVersion) || '');
            ")
          fi
          if [ -z "${VERSION_CODE}" ]; then
            VERSION_CODE="${{ steps.reuse.outputs.version-code }}"
          fi
          if [ -z "${VERSION_CODE}" ]; then
            VERSION_CODE=$(node -e "
              const cfg = JSON.parse(require('fs').readFileSync('app.json', 'utf8'));
              console.log(cfg.expo.android?.versionCode ?? '');
            ")
          fi
          echo "versionCode=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Built versionCode: ${VERSION_CODE}"

      - name: Create GitHub Release
        id: release
        if: steps.check-release.outputs.existing != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TukiWatch v${{ steps.version.outputs.version }}
          files: app/build/*.apk
          generate_release_notes: true

      - name: Update version.json
        if: steps.check-release.outputs.existing != 'true'
        run: |
          node -e "
            const fs = require('fs');
            const v = '${{ steps.version.outputs.version }}';
            const code = ${{ steps.versioncode.outputs.versionCode }};
            const apk = 'https://github.com/${{ github.repository }}/releases/download/v' + v + '/' + fs.readdirSync('build').find(f => f.endsWith('.apk'));
            const manifest = {
              version: v,
              versionCode: code,
              apkUrl: apk,
              releaseNotes: 'Released via GitHub Actions.',
              mandatory: false,
              minAndroidVersion: 8,
            };
            fs.writeFileSync('version.json', JSON.stringify(manifest, null, 2) + '\n');
          "

      - name: Commit version.json + app.json
        if: steps.check-release.outputs.existing != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json app.json
          git commit -m "chore: bump version to v${{ steps.version.outputs.version }}"
          git push
