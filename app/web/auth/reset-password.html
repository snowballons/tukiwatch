<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- SEO Meta Tags -->
    <title>StreamWatch - Reset Password</title>
    <meta name="description" content="Reset your StreamWatch account password. Secure password recovery for live stream tracking app.">
    <meta name="robots" content="noindex, nofollow">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://streamwatch.snowballons.com/auth/reset-password">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://streamwatch.snowballons.com/logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://streamwatch.snowballons.com/logo.png">
    <link rel="apple-touch-icon" href="https://streamwatch.snowballons.com/logo.png">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../style.css">

    <style>
        :root {
            --input-bg: #222;
            --input-border: #333;
            --error-color: #ff4444;
            --success-color: #00FF7F;
        }

        .reset-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 60px 20px;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .reset-card {
            background-color: #222;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--dark-gray-border);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .reset-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .reset-header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            color: var(--secondary-text);
        }

        .reset-header p {
            color: var(--light-gray-text);
            font-size: 1em;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--secondary-text);
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--secondary-text);
            font-size: 1em;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(0, 255, 127, 0.1);
        }

        .form-group input::placeholder {
            color: #888;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background-color: var(--accent-green);
            color: var(--primary-bg);
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.3s ease, transform 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #00cc66;
            transform: translateY(-2px);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            background-color: var(--accent-green);
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }

        .message.error {
            background-color: rgba(255, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid var(--error-color);
        }

        .message.success {
            background-color: rgba(0, 255, 127, 0.1);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link a:hover {
            color: var(--accent-green);
        }

        .token-missing {
            text-align: center;
            color: var(--error-color);
        }

        .token-missing a {
            color: var(--accent-blue);
        }

        .password-strength {
            margin-top: 8px;
            font-size: 0.9em;
            color: var(--light-gray-text);
        }

        .password-strength.weak {
            color: var(--error-color);
        }

        .password-strength.medium {
            color: #ffaa00;
        }

        .password-strength.strong {
            color: var(--success-color);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: var(--primary-bg);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <div class="reset-header">
                <h1>Reset Password</h1>
                <p id="instruction-text">Enter your new password below.</p>
            </div>

            <!-- Error/Success Messages -->
            <div id="message-container"></div>

            <!-- Password Form -->
            <form id="reset-form">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                        required
                        minlength="6"
                        autocomplete="new-password"
                    >
                    <div id="password-strength" class="password-strength"></div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm new password"
                        required
                        minlength="6"
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" id="submit-btn" class="btn-submit">
                    Reset Password
                </button>
            </form>

            <div class="back-link">
                <a href="https://streamwatch.snowballons.com">← Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Reset Password Logic -->
    <script>
        // Initialize Supabase
        const supabaseUrl = 'https://lnuxpkwnbesqrqsxyiek.supabase.co';
        const supabaseAnonKey = 'sb_publishable_l4oGvz6JT3D4TAKy9kUpCQ_lbZOTD5W';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        // DOM Elements
        const form = document.getElementById('reset-form');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const messageContainer = document.getElementById('message-container');
        const submitBtn = document.getElementById('submit-btn');
        const instructionText = document.getElementById('instruction-text');
        const passwordStrengthEl = document.getElementById('password-strength');

        // Get token and type from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const type = urlParams.get('type');

        // Validate token exists
        if (!token) {
            showMessage('Invalid or expired reset link. Please request a new password reset.', 'error');
            form.classList.add('hidden');
            instructionText.classList.add('hidden');
            return;
        }

        // Verify token is for recovery type
        if (type && type !== 'recovery') {
            showMessage('Invalid reset link type.', 'error');
            form.classList.add('hidden');
            instructionText.classList.add('hidden');
            return;
        }

        // Password strength checker
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            const strength = calculatePasswordStrength(password);
            passwordStrengthEl.textContent = strength.text;
            passwordStrengthEl.className = 'password-strength ' + strength.level;
        });

        // Confirm password validation
        confirmPasswordInput.addEventListener('input', function() {
            const password = passwordInput.value;
            const confirm = this.value;
            if (confirm && password !== confirm) {
                this.setCustomValidity('Passwords do not match');
            } else {
                this.setCustomValidity('');
            }
        });

        // Form submission
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Validate passwords match
            if (password !== confirmPassword) {
                showMessage('Passwords do not match.', 'error');
                return;
            }

            // Validate minimum length
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters.', 'error');
                return;
            }

            // Show loading state
            setLoading(true);
            hideMessage();

            try {
                // Update password using Supabase
                const { data, error } = await supabase.auth.updateUser({
                    password: password
                }, {
                    query: {
                        access_token: token
                    }
                });

                if (error) {
                    throw error;
                }

                // Success
                showMessage('Password reset successfully! Redirecting to app...', 'success');

                // Disable form
                form.classList.add('hidden');
                instructionText.classList.add('hidden');

                // Try to open the app after 2 seconds
                setTimeout(() => {
                    // Attempt to open the StreamWatch app
                    window.location.href = 'streamwatch://auth/callback?reset=success';
                    
                    // Fallback to home after a delay if app doesn't open
                    setTimeout(() => {
                        window.location.href = 'https://streamwatch.snowballons.com';
                    }, 2000);
                }, 2000);

            } catch (error) {
                console.error('Password reset error:', error);
                showMessage(getErrorMessage(error.message), 'error');
            } finally {
                setLoading(false);
            }
        });

        // Helper functions
        function showMessage(text, type) {
            messageContainer.innerHTML = `<div class="message ${type}">${text}</div>`;
        }

        function hideMessage() {
            messageContainer.innerHTML = '';
        }

        function setLoading(loading) {
            submitBtn.disabled = loading;
            if (loading) {
                submitBtn.innerHTML = '<span class="spinner"></span>Resetting...';
            } else {
                submitBtn.innerHTML = 'Reset Password';
            }
        }

        function getErrorMessage(errorCode) {
            // Map Supabase errors to user-friendly messages
            if (errorCode.includes('invalid') || errorCode.includes('expired')) {
                return 'The reset link is invalid or has expired. Please request a new password reset.';
            }
            if (errorCode.includes('weak')) {
                return 'The password is too weak. Please use a stronger password.';
            }
            return 'Failed to reset password. Please try again or contact support.';
        }

        function calculatePasswordStrength(password) {
            if (!password) return { level: '', text: '' };
            
            let score = 0;
            if (password.length >= 8) score++;
            if (password.length >= 12) score++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
            if (/\d/.test(password)) score++;
            if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) score++;

            if (score <= 2) return { level: 'weak', text: 'Weak password' };
            if (score <= 4) return { level: 'medium', text: 'Medium strength' };
            return { level: 'strong', text: 'Strong password' };
        }
    </script>
</body>
</html>
