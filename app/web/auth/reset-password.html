<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - StreamWatch</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .reset-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background-color: #222;
            border-radius: 12px;
            border: 1px solid var(--dark-gray-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--light-gray-text);
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--dark-gray-border);
            background-color: #1A1A1A;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: var(--accent-green);
        }
        .error-message {
            color: #ff4444;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }
        .success-message {
            color: var(--accent-green);
            margin-bottom: 20px;
            display: none;
            font-size: 16px;
            text-align: center;
        }
        .loading {
            opacity: 0.5;
            pointer-events: none;
        }
        #open-app-btn {
            display: none;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="logo.png" alt="StreamWatch Logo" width="40" height="40">
                <span>StreamWatch</span>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="reset-container" id="reset-box">
            <h2 style="text-align: center; margin-top: 0;">Create New Password</h2>
            <p style="color: var(--light-gray-text); text-align: center; margin-bottom: 30px;">Enter a secure password for your StreamWatch account.</p>
            
            <div id="error" class="error-message"></div>
            <div id="success" class="success-message">Password updated successfully!</div>

            <form id="reset-form">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" required minlength="6">
                </div>
                <button type="submit" class="btn primary-btn" style="width: 100%;">Update Password</button>
            </form>

            <div id="open-app-btn">
                <a href="streamwatch://auth/reset-password" class="btn secondary-btn" style="width: 100%; box-sizing: border-box;">Open StreamWatch App</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Use the values from your lib/supabase.ts (or inject them if you have a build process)
        const SUPABASE_URL = 'https://lnuxpkwnbesqrqsxyiek.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_l4oGvz6JT3D4TAKy9kUpCQ_lbZOTD5W'; // This needs to be the actual key

        // NOTE: In a real production environment, you'd want to handle the ANON KEY securely.
        // For now, I'll extract it from your project context if I can find it, 
        // or you should replace it after I create the file.
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Listen for auth state changes (including password recovery)
        supabaseClient.auth.onAuthStateChange((event, _session) => {
            if (event === 'PASSWORD_RECOVERY') {
                console.log('Password recovery session established');
            }
        });

        const form = document.getElementById('reset-form');
        const errorDiv = document.getElementById('error');
        const successDiv = document.getElementById('success');
        const openAppBtn = document.getElementById('open-app-btn');
        const resetBox = document.getElementById('reset-box');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';
            
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (password !== confirm) {
                errorDiv.textContent = 'Passwords do not match.';
                errorDiv.style.display = 'block';
                return;
            }

            form.classList.add('loading');

            const { error } = await supabaseClient.auth.updateUser({ password: password });

            form.classList.remove('loading');

            if (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
            } else {
                form.style.display = 'none';
                successDiv.style.display = 'block';
                openAppBtn.style.display = 'block';
                resetBox.querySelector('p').textContent = 'You can now sign in with your new password.';
            }
        });

        // Wait for Supabase to process URL hash fragment, then check session
        window.addEventListener('load', () => {
            // Allow time for Supabase client to process hash fragment
            setTimeout(async () => {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                if (error) {
                    errorDiv.textContent = `Error establishing session: ${error.message}`;
                    errorDiv.style.display = 'block';
                    form.style.display = 'none';
                } else if (!session) {
                    errorDiv.textContent = 'Invalid or expired reset link. Please request a new one from the app.';
                    errorDiv.style.display = 'block';
                    form.style.display = 'none';
                }
            }, 1000);
        });
    </script>
</body>
</html>
