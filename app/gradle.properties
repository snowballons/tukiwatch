#Kotlin
kotlin.code.style=official
# Keep the compiler JVM well under the machine's RAM: Gradle + Kotlin daemons
# plus D8/AAPT2/Chaquopy native memory must fit in 7.6 GiB.
kotlin.daemon.jvmargs=-Xmx1536M

#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
org.gradle.caching=true
# Cap parallel workers so dexing and Kotlin compilation do not peak together.
org.gradle.workers.max=2

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# App version — single source for the APK and desktop packaging.
APP_VERSION_NAME=1.1.8
APP_VERSION_CODE=15
