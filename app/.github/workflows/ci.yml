name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome Check (Lint + Format + Organize Imports)
        run: bunx @biomejs/biome ci .

      - name: Type Check
        run: bun run type-check

      # Optional: Run tests if you have them
      # - name: Run Tests
      #   run: bun test
