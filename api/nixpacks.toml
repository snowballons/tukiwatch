# Railway.app Configuration for TukiWatch API

[phases.setup]
# Install system packages required for streamlink
aptPkgs = [
    "libxml2-dev",
    "libxslt1-dev", 
    "build-essential"
]

[phases.install]
# Install Python dependencies
cmds = ["pip install -r requirements.txt"]

[phases.start]
# Start the FastAPI application (must match railway.json deploy.startCommand).
# The uvicorn worker class is required: gunicorn's default sync workers cannot
# serve an ASGI app.
cmd = "gunicorn main:app --host 0.0.0.0 --port $PORT --workers 2 --worker-class uvicorn.workers.UvicornWorker"
